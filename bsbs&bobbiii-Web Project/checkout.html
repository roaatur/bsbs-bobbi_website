<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - BSBS & Bobbi PetFood Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.jpg" alt="BSBS & Bobbi Logo">
                <div class="brand-name">
                    <span class="main-brand">BSBS & Bobbi</span>
                    <span class="sub-brand">PetFood Store</span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="homepage.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="icon-bar">
            <div class="login-icon" id="login-icon">
                <i class="fas fa-user"></i>
                
            </div>
            <div class="cart-icon" id="cart-icon">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>
            </div>
        </nav>
    </header>

    <main class="checkout-page">
        <div class="checkout-container">
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div class="order-number">
                    <p>Order #: <span id="order-number"></span></p>
                </div>
                <div id="cart-items-list">
                    <!-- Cart items will be loaded here -->
                </div>
                <div class="order-total">
                    <h3>Total: $<span id="cart-total">0.00</span></h3>
                </div>
            </div>

            <div class="checkout-form">
                <h2>Shipping Information</h2>
                <form id="checkout-form">
                    <input type="text" id="name" name="name" placeholder="Full Name" required>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                    <input type="text" id="address" name="address" placeholder="Shipping Address" required>
                    <input type="text" id="city" name="city" placeholder="City" required>
                    <input type="text" id="zip" name="zip" placeholder="ZIP Code" required>
                    
                    <div class="payment-section">
                        <h3>Payment Method</h3>
                        <div class="payment-options">
                            <div class="payment-option">
                                <input type="radio" id="credit-card" name="payment" value="credit-card" required>
                                <label for="credit-card">
                                    <i class="fas fa-credit-card"></i>
                                    Credit Card
                                </label>
                            </div>
                            <div class="payment-option">
                                <input type="radio" id="paypal" name="payment" value="paypal">
                                <label for="paypal">
                                    <i class="fab fa-paypal"></i>
                                    PayPal
                                </label>
                            </div>
                            <div class="payment-option">
                                <input type="radio" id="cash" name="payment" value="cash">
                                <label for="cash">
                                    <i class="fas fa-money-bill-wave"></i>
                                    Cash on Delivery
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="checkout-btn">Place Order</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 BSBS & Bobbi PetFood Store. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
