<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - BSBS & Bobbi PetFood Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.jpg" alt="BSBS & Bobbi Logo">
                <div class="brand-name">
                    <span class="main-brand">BSBS & Bobbi</span>
                    <span class="sub-brand">PetFood Store</span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="homepage.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="icon-bar">
            <div class="login-icon" id="login-icon">
                <i class="fas fa-user"></i>
                
            </div>
            <div class="cart-icon" id="cart-icon">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>
            </div>
        </nav>
    </header>

    <main class="cart-page">
        <div class="cart-container">
            <h1>Your Shopping Cart</h1>
            <div id="empty-cart-message" class="empty-cart-message" style="display: none;">
                <i class="fas fa-shopping-cart"></i>
                <h2>Your cart is empty</h2>
                <p>Looks like you haven't added any items to your cart yet.</p>
                <a href="homepage.html" class="continue-shopping-btn">Continue Shopping</a>
            </div>
            <div class="cart-items" id="cart-items-list">
                <!-- Cart items will be loaded here -->
            </div>
            <div class="cart-total" id="cart-total-section" style="display: none;">
                <h3>Total: $<span id="cart-total">0.00</span></h3>
                <a href="checkout.html" class="proceed-to-checkout-btn">Proceed to Checkout</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 BSBS & Bobbi PetFood Store. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
